# ATOM trading configuration — dotted keys (properties style).
# Defaults / ‹TBD› — the research loop (Phase 5) proposes a ParameterSet that overrides
# these, gated by morning human approval. Indicator.* mirror what Penguin's enriched
# pipeline computes — ATOM CONSUMES them, it does not recompute (don't duplicate Penguin).

# --- capital / sizing ---
strategy.lot.size=75
strategy.wing.strikes=4
risk.deploy.inr=200000
risk.sl.pct=35
risk.dd.floor.pct=10

# --- expiry ---
expiry.rule=current_week

# --- regime / decision ---
regime.entry.min_confidence=0.45
regime.adx.trend_threshold=22

# --- indicator families (consumed from Penguin enriched; ATOM does not recompute) ---
indicator.ema.enabled=true
indicator.ema.lookback=20
indicator.rsi.enabled=true
indicator.rsi.bull=55
indicator.rsi.bear=45
indicator.supertrend.enabled=true
indicator.adx.enabled=true
indicator.india_vix.enabled=true
indicator.pcr.enabled=true
indicator.structure.enabled=true

# --- ATOM-Lights (multi-TF candle-color entry layer; SHADOW = log only, no gating) ---
lights.enabled=true
lights.shadow=true
lights.body.min_frac=0.15
lights.gap.threshold_pct=0.3
lights.time_gate=10:15
